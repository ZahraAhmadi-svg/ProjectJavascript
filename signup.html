
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Create your Respair Dawn account">

    <title>Register | Respair Dawn</title>


    <!-- Google Fonts -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
          rel="stylesheet">


    <!-- Bootstrap Icons -->

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">


    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <!-- Project CSS -->

    <link rel="stylesheet"
          href="CSS/variables.css">

    <link rel="stylesheet"
          href="CSS/signup.css">

</head>


<body>


    <main class="signup-page">


        <!-- LEFT IMAGE -->

        <section class="signup-image">

            <img src="images/business.jpeg"
                 alt="Respair Dawn">

            <div class="image-overlay">

                <h2>
                    Begin Your Journey
                </h2>

                <p>
                    Discover your path, develop your skills,
                    and become the person you want to be.
                </p>

            </div>

        </section>



        <!-- SIGN UP FORM -->

        <section class="signup-content">


            <div class="signup-card">


                <!-- Already Member -->

                <div class="login-link">

                    <span>
                        Already a member?
                    </span>

                    <a href="login.html">
                        Sign in
                    </a>

                </div>



                <!-- Heading -->

                <div class="signup-heading">

                    <p class="small-title">
                        RESPAIR DAWN
                    </p>

                    <h1>
                        Create Account
                    </h1>

                    <p>
                        Start your journey with us.
                    </p>

                </div>



                <!-- Form -->

                <form id="signupForm">


                    <!-- Full Name -->

                    <div class="form-group">

                        <label for="fullName">
                            Full Name
                        </label>

                        <div class="input-box">

                            <i class="bi bi-person"></i>

                            <input
                                type="text"
                                id="fullName"
                                placeholder="Enter your full name"
                                required>

                        </div>

                    </div>



                    <!-- Username -->

                    <div class="form-group">

                        <label for="username">
                            Username
                        </label>

                        <div class="input-box">

                            <i class="bi bi-person-badge"></i>

                            <input
                                type="text"
                                id="username"
                                placeholder="Choose a username"
                                required>

                        </div>

                    </div>



                    <!-- Email -->

                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <div class="input-box">

                            <i class="bi bi-envelope"></i>

                            <input
                                type="email"
                                id="email"
                                placeholder="Enter your email"
                                required>

                        </div>

                    </div>



                    <!-- Password -->

                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <div class="input-box">

                            <i class="bi bi-lock"></i>

                            <input
                                type="password"
                                id="password"
                                placeholder="Create a password"
                                required>

                            <i
                                class="bi bi-eye-slash password-icon"
                                id="passwordIcon">
                            </i>

                        </div>

                    </div>



                    <!-- Confirm Password -->

                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <div class="input-box">

                            <i class="bi bi-shield-lock"></i>

                            <input
                                type="password"
                                id="confirmPassword"
                                placeholder="Confirm your password"
                                required>

                            <i
                                class="bi bi-eye-slash password-icon"
                                id="confirmPasswordIcon">
                            </i>

                        </div>

                    </div>



                    <!-- Terms -->

                    <div class="terms">

                        <input
                            type="checkbox"
                            id="terms"
                            required>

                        <label for="terms">

                            I agree to the
                            <a href="#">
                                Terms & Conditions
                            </a>

                        </label>

                    </div>



                    <!-- Error -->

                    <div
                        id="signupMessage"
                        class="signup-message">
                    </div>



                    <!-- Button -->

                    <button
                        type="submit"
                        class="signup-btn">

                        Create Account

                        <i class="bi bi-arrow-right"></i>

                    </button>


                </form>



                <!-- Footer -->

                <p class="signup-footer">

                    Already have an account?

                    <a href="login.html">
                        Sign in
                    </a>

                </p>


            </div>

        </section>


    </main>



    <!-- JavaScript -->

    <script src="JS/signup.js"></script>

</body>

</html>
